services:
  db:
    image: postgres
    container_name: vat-refund-postgres
    restart: always
    environment:
      POSTGRES_DB: vat_refund_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5433:5432"
    volumes:
      - vat_refund_postgres_data:/var/lib/postgresql

volumes:
  vat_refund_postgres_data:
