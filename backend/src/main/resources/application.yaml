spring:
  application:
    name: vat-refund-backend

  datasource:
    url: jdbc:postgresql://localhost:5433/vat_refund_db
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080